<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Violet Agent</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- 顶栏：标题 + 窗口控制 -->
      <header class="topbar" data-tauri-drag-region>
        <span class="brand" id="brandTitle">Violet Agent</span>
        <div class="win-controls">
          <button id="langBtn" class="lang-btn" data-i18n="btnZh">中文</button>
          <button id="winMin" class="win-btn" title="minimize">–</button>
          <button id="winClose" class="win-btn" title="close">×</button>
        </div>
      </header>

      <main class="layout">
        <!-- 左侧导航（正常按钮） -->
        <nav class="nav">
          <button class="nav-item active" data-key="chat" data-i18n="navChat">Chat</button>
          <button class="nav-item" data-key="wallet" data-i18n="navWallet">Wallet</button>
          <button class="nav-item" data-key="portfolio" data-i18n="navPortfolio">Portfolio</button>
          <button class="nav-item" data-key="orders" data-i18n="navOrders">Orders</button>
          <button class="nav-item" data-key="settings" data-i18n="navSettings">Settings</button>
          <button class="nav-item" data-key="mother" data-i18n="navMother">Mother Key</button>
        </nav>

        <!-- 中间内容区 -->
        <section class="content">
          <!-- Chat 视图：M1 对话面板 -->
          <div id="viewChat" class="view view-chat">
            <div id="chatLog" class="chat-log" aria-live="polite"></div>
            <div class="chat-input-row">
              <input id="chatInput" class="chat-input" type="text" data-i18n="chatPlaceholder" placeholder="message Violet…" autocomplete="off" />
              <button id="chatSend" class="chat-send" data-i18n="chatSend">Send</button>
            </div>
          </div>

          <!-- 其他视图占位 -->
          <div id="viewWallet" class="view view-placeholder hidden">
            <code id="healthJson" class="health">checking…</code>
          </div>
          <div id="viewPortfolio" class="view view-placeholder hidden">
            <p class="placeholder-text" data-i18n="phPortfolio">Portfolio · on-chain · M3</p>
          </div>
          <div id="viewOrders" class="view view-placeholder hidden">
            <p class="placeholder-text" data-i18n="phOrders">Orders · trading · M4</p>
          </div>
          <!-- Settings 视图 -->
          <div id="viewSettings" class="view view-settings hidden">
            <div class="settings-scroll">
              <!-- LLM 连接 -->
              <section class="setting-card">
                <h3 class="setting-title" data-i18n="secConn">LLM Connection</h3>
                <div class="setting-row">
                  <label data-i18n="fBaseUrl">Base URL</label>
                  <input id="cfgBaseUrl" type="text" placeholder="https://api.deepseek.com/v1" />
                </div>
                <div class="setting-row">
                  <label data-i18n="fModel">Model</label>
                  <input id="cfgModel" type="text" placeholder="deepseek-chat" />
                </div>
                <div class="setting-row">
                  <label data-i18n="fApiKey">API Key</label>
                  <input id="cfgApiKey" type="password" autocomplete="off" />
                  <span id="keyState" class="key-state"></span>
                </div>
                <div class="setting-row">
                  <label></label>
                  <div class="btn-row">
                    <button id="cfgSave" class="set-btn primary" data-i18n="btnSave">Save</button>
                    <button id="cfgTest" class="set-btn" data-i18n="btnTest">Test connection</button>
                  </div>
                </div>
                <div id="connStatus" class="conn-status"></div>
              </section>

              <!-- 语言 -->
              <section class="setting-card">
                <h3 class="setting-title" data-i18n="secLang">Language</h3>
                <div class="setting-row">
                  <label data-i18n="fLang">Interface</label>
                  <div class="btn-row">
                    <button id="cfgLangEn" class="set-btn">English</button>
                    <button id="cfgLangZh" class="set-btn">中文</button>
                  </div>
                </div>
              </section>

              <!-- 技能（模块能力清单） -->
              <section class="setting-card">
                <h3 class="setting-title" data-i18n="secSkills">Skills</h3>
                <ul class="skill-list" id="skillList"></ul>
              </section>
            </div>
          </div>
          <div id="viewMother" class="view view-placeholder hidden">
            <p class="placeholder-text" data-i18n="phMother">Mother Key · local-only · BIP39</p>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/ui/main.js"></script>
  </body>
</html>
