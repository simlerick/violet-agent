<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Violet Agent</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- 顶部拖拽区（无边框窗口） -->
      <header class="topbar" data-tauri-drag-region></header>

      <!-- 窗口控制 -->
      <div class="win-controls">
        <button id="langBtn" class="lang-btn" data-i18n="btnZh">中文</button>
        <button id="winMin" class="win-btn" title="minimize">–</button>
        <button id="winClose" class="win-btn" title="close">×</button>
      </div>

      <!-- 导航热区（透明，点击切换视图） -->
      <nav class="nav">
        <button class="nav-item active" data-key="wallet" data-i18n="navWallet">Wallet</button>
        <button class="nav-item" data-key="portfolio" data-i18n="navPortfolio">Portfolio</button>
        <button class="nav-item" data-key="orders" data-i18n="navOrders">Orders</button>
        <button class="nav-item" data-key="settings" data-i18n="navSettings">Settings</button>
        <button class="nav-item" data-key="mother" data-i18n="navMother">Mother Key</button>
      </nav>

      <!-- 数据层（叠在 Wallet Status 信纸上） -->
      <code id="healthJson" class="health">checking…</code>

      <!-- 视图占位层（非 Wallet 视图提示） -->
      <div id="viewHint" class="view-hint hidden"></div>

      <!-- Send Letter 输入热区 -->
      <div class="send-zone">
        <input id="orderInput" class="order-input" type="text" data-i18n="pnSendPlaceholder" placeholder="type your order…" />
        <button id="sendBtn" class="send-btn"><span class="send-icon">✉</span></button>
      </div>

      <!-- Self 开关 -->
      <label class="switch">
        <input id="selfToggle" type="checkbox" checked />
        <span class="track"></span>
      </label>

      <!-- 动作按钮热区（纸感实底，盖住图上旧字） -->
      <div class="actions">
        <button class="action-btn active" data-action="idle" data-i18n="actIdle">Idle</button>
        <button class="action-btn" data-action="wave" data-i18n="actWave">Wave</button>
        <button class="action-btn" data-action="deliver" data-i18n="actDeliver">Deliver Letter</button>
        <button class="action-btn" data-action="think" data-i18n="actThink">Think</button>
      </div>

      <!-- 独立立绘层（透明 PNG，可动画） -->
      <div class="portrait-wrap" id="portraitWrap">
        <img id="mainPortrait" class="portrait p-idle" src="/assets/violet-portrait-t.png" alt="Violet" draggable="false" />
      </div>
    </div>

    <script type="module" src="/ui/main.js"></script>
  </body>
</html>
