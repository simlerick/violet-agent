<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Violet Agent</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- 左侧：品牌 + 竖排导航 -->
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-name" data-i18n="appName">Violet Agent</span>
        </div>
        <nav class="nav">
          <a class="nav-item active" data-key="wallet"><span class="nav-dot"></span><span data-i18n="navWallet">Wallet</span></a>
          <a class="nav-item" data-key="portfolio"><span class="nav-dot"></span><span data-i18n="navPortfolio">Portfolio</span></a>
          <a class="nav-item" data-key="orders"><span class="nav-dot"></span><span data-i18n="navOrders">Orders</span></a>
          <a class="nav-item" data-key="settings"><span class="nav-dot"></span><span data-i18n="navSettings">Settings</span></a>
          <a class="nav-item" data-key="mother"><span class="nav-dot"></span><span data-i18n="navMother">Mother Key</span></a>
        </nav>
        <div class="lang-wrap">
          <button id="langBtn" class="lang-btn" data-i18n="btnZh">中文</button>
        </div>
      </aside>

      <!-- 主区 -->
      <main class="main">
        <header class="topbar">
          <h1 class="title" data-i18n="appName">Violet Agent</h1>
        </header>

        <section class="content">
          <!-- 中间功能面板 -->
          <div class="panels">
            <article class="paper-panel">
              <h2 data-i18n="pnWalletStatus">Wallet Status</h2>
              <div class="status-row">
                <span class="status-dot"></span>
                <code id="healthJson">checking…</code>
              </div>
            </article>

            <article class="paper-panel">
              <h2 data-i18n="pnBalance">Balance</h2>
              <div class="balance-line"></div>
              <p class="placeholder" data-i18n="pnBalancePlaceholder">Child wallet on Solana, awaiting setup.</p>
            </article>

            <article class="paper-panel">
              <h2 data-i18n="pnHistory">History</h2>
              <ul class="tx-list">
                <li class="tx-row"></li>
                <li class="tx-row"></li>
                <li class="tx-row"></li>
              </ul>
              <p class="placeholder" data-i18n="pnHistoryPlaceholder">No letters sent yet.</p>
            </article>

            <article class="paper-panel">
              <h2 data-i18n="pnSend">Send Letter</h2>
              <button class="send-btn" data-i18n="pnSendBtn">Compose order</button>
            </article>
          </div>

          <!-- 右侧：原版立绘 -->
          <div class="portrait-panel">
            <img src="/assets/violet-portrait.png" alt="Violet" class="portrait" />
            <div class="portrait-caption" data-i18n="portraitCaption">Auto Memory Doll</div>
          </div>
        </section>
      </main>

      <!-- 右下角：桌宠动作区 -->
      <div class="chibi-zone">
        <div class="action-buttons">
          <button class="action-btn active" data-action="idle" data-i18n="actIdle">Idle</button>
          <button class="action-btn" data-action="wave" data-i18n="actWave">Wave</button>
          <button class="action-btn" data-action="deliver" data-i18n="actDeliver">Deliver Letter</button>
          <button class="action-btn" data-action="think" data-i18n="actThink">Think</button>
        </div>
        <div id="chibi" class="chibi" data-action="idle">
          <img src="/assets/violet-chibi.png" alt="Violet chibi" />
          <div class="bubble hidden"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/ui/main.js"></script>
  </body>
</html>
