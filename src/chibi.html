<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Violet Pet</title>
    <link rel="stylesheet" href="/ui/chibi.css" />
  </head>
  <body>
    <!-- 无背景 Q 版角色：固定、不可拖、点击互动聊天 -->
    <div id="pet" class="pet">
      <div class="pet-stage">
        <img id="petImg" src="/assets/chibi-idle.png" alt="Violet" draggable="false" />
        <div id="bubble" class="bubble hidden"></div>
      </div>

      <!-- 聊天面板（点击角色展开） -->
      <div id="chat" class="chat hidden">
        <div class="chat-head">
          <span class="chat-title">Violet</span>
          <button id="chatClose" class="chat-close">×</button>
        </div>
        <div id="chatLog" class="chat-log">
          <div class="msg violet">Welcome. I am at your service.</div>
        </div>
        <div class="chat-input-row">
          <input id="chatInput" class="chat-input" type="text" placeholder="tell me…" />
          <button id="chatSend" class="chat-send">✉</button>
        </div>
      </div>
    </div>
    <script type="module" src="/ui/chibi.js"></script>
  </body>
</html>
