<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Violet Pet</title>
    <link rel="stylesheet" href="/ui/chibi.css" />
  </head>
  <body>
    <!-- 豆包式悬浮球：透明、置顶、可拖拽 -->
    <div id="pet" class="pet" data-tauri-drag-region>
      <div class="ball">
        <img id="petImg" src="/assets/chibi-idle.png" alt="Violet" draggable="false" />
        <div id="bubble" class="bubble hidden"></div>
      </div>
      <div id="menu" class="menu hidden">
        <button class="menu-btn" data-action="idle">Idle</button>
        <button class="menu-btn" data-action="wave">Wave</button>
        <button class="menu-btn" data-action="deliver">Deliver Letter</button>
        <button class="menu-btn" data-action="think">Think</button>
      </div>
    </div>
    <script type="module" src="/ui/chibi.js"></script>
  </body>
</html>
